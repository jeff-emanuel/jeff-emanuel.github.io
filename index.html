
<html>
<head>
<style>

#main {
  background-color: #e8f8ff;
  border-width: 2px;
  border-style: solid;
  padding: 0px 0px 0px 0px;
  margin: 10px 10px 10px 10px;
  width: 90%;
  height: 90%;
}

    .hbox {
        display: flex;
        flex-direction: row;
    }
    #controls > div {
        //background-color: #8a8;
        margin: 10px;
        padding: 5px;
        width: 300px;
    }

    .slider {
      width: 75%;
    }

    .sliderText {
      width: 20%;
    }

</style>
<script>



function ftToKm(f) {
  return f*0.3048 / 1000
}

const h3CellEdgeLengths = [
       1281.256011,
       483.0568391,
       182.5129565,
       68.97922179,
       26.07175968,
       9.854090990,
       3.724532667,
       1.406475763,
       0.531414010,
       0.200786148,
       0.075863783,
       0.028663897,
       0.010830188,
       0.004092010,
       0.001546100,
       0.000584169];

var polycoords = [
  [-100,0], [-50,86.6], [50,86.6], [100,0], [50,-86.6], [-50,-86.6] ];

function hex(sz, loc, fill, sw=1) {

  let points="";
  for (var i=0;i<polycoords.length;i++) {
    let pt = polycoords[i].map(u => sz*u);
    //console.log(pt);
    points += (pt[0]+loc[0]) + "," + (pt[1]+loc[1]) + " ";
  }
  //console.log(points);

  var poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon")
  poly.setAttribute("points", points);
  poly.setAttribute("fill", fill);
  poly.setAttribute("stroke", "black");
  poly.setAttribute("stroke-width", sw+"%");

  return poly;
}

function add2(a, b) {
  return [a[0]+b[0], a[1]+b[1]];
}

function hexring(k, sz, ctr, fill, sw=1) {

  let ring = [];

  //console.log("hexring sz=",sz)

  let radius = k*sz*100*Math.sqrt(3);
  let deltaAngle = 60*Math.PI/180;
  for (let i=0;i<6;i++) {
    let angle = i*deltaAngle
    let angle2 = angle + Math.PI/6

    let loc = add2(ctr, [radius*Math.sin(angle),radius*Math.cos(angle)])

    let sin2 = Math.sin(angle2)
    let cos2 = Math.cos(angle2)
    for (let j=0;j<k;j++) {
      let r = j*sz*100*Math.sqrt(3)
      let loc2 = add2(loc, [r*cos2,-r*sin2])
      ring.push(hex(sz, loc2, fill, sw))
    }
  }

  return ring;
}

function maxpoints(k, sz, ctr, clr, sw=2) {
  let g = document.createElementNS("http://www.w3.org/2000/svg", "g")


  let nearX = ctr[0]+100*sz*Math.cos(Math.PI/3)
  let nearY = ctr[1]+100*sz*Math.sin(Math.PI/3)

  let farX= ctr[0]-(2*k+1)*100*sz*Math.sqrt(3)/2*Math.cos(Math.PI/6)
  farX += 100*sz/2*Math.cos(Math.PI/3)

  let farY= ctr[1]-(2*k+1)*100*sz*Math.sqrt(3)/2*Math.sin(Math.PI/6)
  farY -= 100*sz/2*Math.sin(Math.PI/3)


  let circle
  circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")
  circle.setAttribute("cx", ""+nearX)
  circle.setAttribute("cy", ""+nearY)
  circle.setAttribute("r", ""+10*sz)
  circle.setAttribute("stroke", clr);
  circle.setAttribute("fill", clr);
  g.append(circle)

  circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")

  circle.setAttribute("cx", ""+farX)
  circle.setAttribute("cy", ""+farY)
  circle.setAttribute("r", ""+10*sz)
  circle.setAttribute("stroke", clr);
  circle.setAttribute("fill", clr);
  g.append(circle)

  line = document.createElementNS("http://www.w3.org/2000/svg", "polyline")
  line.setAttribute("points", ""+nearX+","+nearY+" "+farX+","+farY)
  line.setAttribute("stroke", clr);
  line.setAttribute("fill", clr);
  line.setAttribute("stroke-width", sw);
  g.append(line)


  return g
}

function minpoints(k, sz, ctr, clr, sw=2) {
  let g = document.createElementNS("http://www.w3.org/2000/svg", "g")


  let nearX = ctr[0]-100*sz*Math.cos(Math.PI/3)
  let nearY = ctr[1]-100*sz*Math.sin(Math.PI/3)

  // 8-> 10, 6->7, 4->4, 2->1
  let r = (3*(k/2)-1)
  console.log(r)
  r *= 100*sz
  let farX= ctr[0]-r*Math.cos(Math.PI/3)
  let farY= ctr[1]-r*Math.sin(Math.PI/3)
  if (k<2) {
    farX= nearX
    farY= nearY
  } else if (k%2==1 && k>2) {
    farX -= 100*sz*Math.sqrt(3)/2*Math.cos(Math.PI/6)
    farY += 100*sz*Math.sqrt(3)/2*Math.sin(Math.PI/6)
  }


  let circle
  circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")
  circle.setAttribute("cx", ""+nearX)
  circle.setAttribute("cy", ""+nearY)
  console.log(sz)
  circle.setAttribute("r", ""+10*sz)
  circle.setAttribute("stroke", clr);
  circle.setAttribute("fill", clr);
  g.append(circle)

  circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")

  circle.setAttribute("cx", ""+farX)
  circle.setAttribute("cy", ""+farY)
  console.log(sz)
  circle.setAttribute("r", ""+10*sz)
  circle.setAttribute("stroke", clr);
  circle.setAttribute("fill", clr);
  g.append(circle)

  line = document.createElementNS("http://www.w3.org/2000/svg", "polyline")
  line.setAttribute("points", ""+nearX+","+nearY+" "+farX+","+farY)
  line.setAttribute("stroke", clr);
  line.setAttribute("fill", clr);
  line.setAttribute("stroke-width", sw);
  g.append(line)


  return g
}

function betterfigure(vw,vh,res,kmax,radius) {
  var div = document.getElementById("main");
  div.replaceChildren()

  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("id", "s");
  
  let vb = "" + -vw/2 + " " + -vh/2 + " " + vw + " " + vh;
  svg.setAttribute("viewBox",vb);
  svg.setAttribute("width","100%");
  svg.setAttribute("height","100%");

  let g = document.createElementNS("http://www.w3.org/2000/svg", "g")
  let rot=0;
  g.setAttribute("transform","rotate("+rot*180/Math.PI+")")

  let offset = [0,0];
  let sw = 0.0625/2  // stroke width
  let scale = h3CellEdgeLengths[res];

//console.log("res",res,"scale",scale,"radius",radius)

  g.appendChild(hex(scale/1, offset, "#afa", sw));
  for (let k=1;k<kmax;k++) {
    let ring = hexring(k, scale/1, offset, "none", sw/4);
    g.append(...ring);
  }
  if (kmax>0) {
    // Last ring is bolder
    ring = hexring(kmax, scale/1, offset, "#ffe0e800", sw);
    g.append(...ring);
  }


  let cntr = [-50*scale/1,86.6*scale/1];
  for (let clr of ["#f000","#00f"]) {
    let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")

    circle.setAttribute("cx", ""+cntr[0])
    circle.setAttribute("cy", ""+cntr[1])
    circle.setAttribute("r", ""+radius*100)
    circle.setAttribute("stroke", clr);
    circle.setAttribute("fill", "#0000");
    g.append(circle)

    /*
    circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")
    circle.setAttribute("cx", ""+cntr[0])
    circle.setAttribute("cy", ""+cntr[1])
    circle.setAttribute("r", ""+3)
    circle.setAttribute("stroke", clr);
    circle.setAttribute("fill", clr);
    g.append(circle)
    */

    cntr = [0,0];
  }


  div.appendChild(svg);

  svg.append(g)
}

function updatefigure() {
  let radius = document.getElementById("searchRange").value;
  document.getElementById("searchText").value = radius;
  radius = ftToKm(radius);

  let res = document.getElementById("resRange").value;
  document.getElementById("resText").value = res;

  let k = document.getElementById("kRange").value;
  document.getElementById("kText").value = k;

  //console.log(radius, res, k);

  betterfigure(1000,1000, res,k,radius);
}

function computeResK() {
  let radius = ftToKm(document.getElementById("searchRange").value);
  console.log("computeResK radius:",radius,"(km)");

  // Finds the res and k, k up k=4 where the kring short diameter is >= radius
  // by the least distance.
  kratios = [ [1, 2], [2, 4], [3, 5], [4, 7]];
  let maxkratio = 7; 

  let best = {res: 0, k: 0,surplus: Infinity};
  for (let res = 0; res<h3CellEdgeLengths.length; res++) {
    let edgelength = h3CellEdgeLengths[res];
    let ratio = radius/edgelength;
    console.log("res",res,"edgelength:",edgelength,"ratio",ratio);

    if (ratio>=1 && ratio<=maxkratio) {

      for (let ik = 0; ik<kratios.length; ik++) {
        let surplus = (kratios[ik][1] - ratio) * edgelength;
        let k = kratios[ik][0];
        console.log("k",k,"surplus",surplus)
        if (surplus>0 && surplus<best.surplus) {
          console.log("new best")
          best = {res: res, k: k, surplus: surplus}
        }
      }
    }

  }

  console.log(best);

  document.getElementById("resRange").value = best.res;

  document.getElementById("kRange").value = best.k;

  updatefigure();
}

      svg.setAttribute("id", "s");

      svg.setAttribute("viewBox",vb); //"-600 -600 1200 1200");
      svg.setAttribute("width","100%");
      svg.setAttribute("height","100%");



    /*

    kmax = Math.ceil((radius/shortradius-1)/2*2/Math.sqrt(3));

    let longradius = 100 * scale;  // aka edge length
    console.log("edge length",longradius);
    // k   longradiuses
    // 0         1           k+1
    // 1         2           +1

    let ratio = Math.floor(radius/longradius)
    console.log("ratio",ratio);
    let addend = 1;
    let radiuses = 0;
    for (let k =0; radiuses<=ratio; k++) {
      radiuses += addend;
      if (addend==1) {
        addend=2
      } else {
        addend=1
      }
      kmax = k;
    }

    //kmax = Math.ceil((radius/shortradius+1)/2);
    console.log("radius / edge length",radius/longradius);
    */


    console.log("kmax",kmax);

    offset = [0,0];

    g = document.createElementNS("http://www.w3.org/2000/svg", "g")
    g.setAttribute("transform","rotate("+rot*180/Math.PI+")")

    g.appendChild(hex(scale, offset, "#afa", sw));
    for (let k=1;k<kmax;k++) {
      let ring = hexring(k, scale, offset, "none", sw/4);

    if (kmax>0) {

    /*

    circle.setAttribute("cx", ""+0)
    circle.setAttribute("cy", ""+0)
    circle.setAttribute("r", ""+radius)
    circle.setAttribute("stroke", "#808");
    circle.setAttribute("fill", "#0000");
    g.append(circle)



    // Show search radius around inner point of maxpoints.
    let nearX = offset[0]+100*scale*Math.cos(Math.PI/3)

    circle = document.createElementNS("http://www.w3.org/2000/svg", "circle")

    circle.setAttribute("cx", ""+0)

</script>



</head>
<body onload="updatefigure(1000,1000, 7,1,50)">
<div id="main">
</div>

<div class="hbox" id="controls">

  <div>

      <input type="range"
        min="10" max="200000" value="1000" class="slider" id="searchRange"
